<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tra cứu đơn đầu tư AgriShare bằng mã đơn để xem trạng thái tư vấn, thanh toán, mùa vụ và nhận sản phẩm."
    />
    <title>AgriShare | Tra cứu đơn đầu tư</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="assets/agrishare-logo-icon.png" />
    <link rel="stylesheet" href="track-order.css?v=20260611-1" />
  </head>
  <body>
    <main class="tracking-shell">
      <section class="tracking-hero">
        <a class="tracking-brand" href="index.html" aria-label="AgriShare">
          <img src="assets/agrishare-emblem.png" alt="" />
          <span>
            <strong><span>AGRI</span>SHARE</strong>
            <small>Đầu tư nông nghiệp - Chia sẻ giá trị - Gắn kết tương lai</small>
          </span>
        </a>
        <div>
          <p class="eyebrow">Tra cứu đơn đầu tư</p>
          <h1>Theo dõi trạng thái đơn và tiến độ mùa vụ.</h1>
          <p>
            Nhập mã đơn AgriShare để xem thông tin dự án, gói đầu tư, thanh toán,
            hình thức nhận sản phẩm và các bước xử lý tiếp theo.
          </p>
        </div>
      </section>

      <section class="tracking-panel">
        <form class="tracking-form" id="trackingForm">
          <label>
            Mã đơn
            <input name="orderCode" type="text" required placeholder="VD: AGS-20260528-ABCDE" />
          </label>
          <button class="primary-button" type="submit">Tra cứu đơn</button>
          <p class="form-status" id="trackingStatus" role="status"></p>
        </form>

        <article class="tracking-result" id="trackingResult" hidden></article>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="track-order.js?v=20260611-1"></script>
  </body>
</html>
