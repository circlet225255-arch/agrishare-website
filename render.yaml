services:
  - type: web
    name: agrishare-api
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: agrishare
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
